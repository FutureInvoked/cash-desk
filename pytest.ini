[pytest]
# The repository root is itself a Python package (the Hermes plugin entry point), so
# pytest must not walk up from tests/ looking for a package root: importlib mode names
# test modules by path. pythonpath lets tests import cashdesk, sending and paths from
# the repository root; confcutdir keeps conftest discovery inside tests/.
testpaths = tests
addopts = --import-mode=importlib --confcutdir=tests
pythonpath = . tests
