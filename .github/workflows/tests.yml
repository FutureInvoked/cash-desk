name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse Desktop as an ES module
        run: node --input-type=module --check < desktop/plugin.js
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install "pytest>=8,<10" "pyyaml>=6,<7" "fastapi>=0.110,<1" "httpx>=0.27,<1"
      - name: Run the test suite
        run: python -m pytest -q
